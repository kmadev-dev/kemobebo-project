<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Ola Tarabah</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ============ HEADER: simplified (logo + back to home + language) ============ -->
    <header class="header">
        <a href="index-en.html"><img src="img/logo.png" alt="logo" class="logo"></a>
        <nav class="navigation">
            <ul>
                <li><a href="index-en.html">Back to Home</a></li>
                <li><a href="booking.html" class="lang-switch">العربية</a></li>
            </ul>
        </nav>
    </header>

    <!-- ============ AUTH CARD: Sign In / Sign Up ============ -->
    <div class="auth-page-wrap">
        <div class="auth-card">

            <!-- Form view: shown before the user is signed in -->
            <div id="authFormsView">
                <h2 class="auth-title">Welcome</h2>
                <p class="auth-subtitle">Sign in or create an account to book your private session</p>

                <div class="auth-tabs">
                    <button type="button" class="auth-tab active" data-tab="signin">Sign In</button>
                    <button type="button" class="auth-tab" data-tab="signup">Sign Up</button>
                </div>

                <div class="auth-error" id="authError"></div>

                <!-- Sign In -->
                <form class="auth-form active" id="signinForm" novalidate>
                    <div class="auth-field">
                        <label for="signinEmail">Email</label>
                        <input type="email" id="signinEmail" autocomplete="email" required>
                    </div>
                    <div class="auth-field">
                        <label for="signinPassword">Password</label>
                        <input type="password" id="signinPassword" autocomplete="current-password" required>
                    </div>
                    <button type="submit" class="auth-submit-btn">Sign In</button>
                </form>

                <!-- Sign Up -->
                <form class="auth-form" id="signupForm" novalidate>
                    <div class="auth-field">
                        <label for="signupName">Full Name</label>
                        <input type="text" id="signupName" autocomplete="name" required>
                    </div>
                    <div class="auth-field">
                        <label for="signupEmail">Email</label>
                        <input type="email" id="signupEmail" autocomplete="email" required>
                    </div>
                    <div class="auth-field">
                        <label for="signupPhone">Phone Number</label>
                        <div class="auth-phone-row">
                            <select id="signupCountryCode">
                                <option value="+971" selected>🇦🇪 +971</option>
                                <option value="+966">🇸🇦 +966</option>
                                <option value="+965">🇰🇼 +965</option>
                                <option value="+974">🇶🇦 +974</option>
                                <option value="+973">🇧🇭 +973</option>
                                <option value="+968">🇴🇲 +968</option>
                                <option value="+20">🇪🇬 +20</option>
                                <option value="+962">🇯🇴 +962</option>
                                <option value="+961">🇱🇧 +961</option>
                                <option value="+964">🇮🇶 +964</option>
                                <option value="+963">🇸🇾 +963</option>
                                <option value="+1">🇺🇸 +1</option>
                                <option value="+44">🇬🇧 +44</option>
                            </select>
                            <input type="tel" id="signupPhone" inputmode="numeric" autocomplete="tel-national" placeholder="5xxxxxxxx" required>
                        </div>
                    </div>
                    <div class="auth-field">
                        <label for="signupPassword">Password</label>
                        <input type="password" id="signupPassword" autocomplete="new-password" required>
                    </div>
                    <div class="auth-field">
                        <label for="signupConfirm">Confirm Password</label>
                        <input type="password" id="signupConfirm" autocomplete="new-password" required>
                    </div>
                    <button type="submit" class="auth-submit-btn">Create Account</button>
                </form>

                <a href="index-en.html" class="auth-back-link">Cancel and go back home</a>
            </div>

            <!-- Success view: shown after a successful sign in / sign up -->
            <div class="auth-success" id="authSuccessView">
                <h2 id="authSuccessTitle">You're signed in ✓</h2>
                <p id="authSuccessMessage">Welcome back. Tap below to finish booking your session on WhatsApp.</p>
                <a href="https://api.whatsapp.com/send?phone=971508780362" target="_blank" class="auth-whatsapp-btn">
                    📅 Finish Booking on WhatsApp
                </a>
                <a href="index-en.html" class="auth-back-link">Back to Home</a>
            </div>

        </div>
    </div>

    <!-- ============ SCRIPT: tab switching + localStorage-based sign in / sign up ============ -->
    <script>
        const STORAGE_KEY = 'ola_coach_users';
        const SESSION_KEY = 'ola_coach_current_user';

        function getUsers() {
            try {
                return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
            } catch {
                return [];
            }
        }
        function saveUsers(users) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
        }
        function rememberSession(email) {
            localStorage.setItem(SESSION_KEY, email);
        }

        // --- Tab switching ---
        const tabs = document.querySelectorAll('.auth-tab');
        const forms = document.querySelectorAll('.auth-form');
        const errorBox = document.getElementById('authError');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                forms.forEach(f => f.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.tab + 'Form').classList.add('active');
                hideError();
            });
        });

        function showError(message) {
            errorBox.textContent = message;
            errorBox.classList.add('visible');
        }
        function hideError() {
            errorBox.classList.remove('visible');
            errorBox.textContent = '';
        }

        function showSuccess(name) {
            document.getElementById('authFormsView').style.display = 'none';
            const successView = document.getElementById('authSuccessView');
            successView.classList.add('active');
            document.getElementById('authSuccessTitle').textContent = 'Welcome, ' + name + ' ✓';
        }

        // --- Sign Up ---
        document.getElementById('signupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            hideError();

            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim().toLowerCase();
            const countryCode = document.getElementById('signupCountryCode').value;
            const phoneDigits = document.getElementById('signupPhone').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirm').value;

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!name || !phoneDigits) {
                showError('Please fill in all fields.');
                return;
            }
            if (!emailPattern.test(email)) {
                showError('Please enter a valid email address.');
                return;
            }
            if (password.length < 6) {
                showError('Password must be at least 6 characters.');
                return;
            }
            if (password !== confirm) {
                showError('Passwords do not match.');
                return;
            }

            const phone = countryCode + ' ' + phoneDigits;
            const users = getUsers();
            if (users.some(u => u.email === email)) {
                showError('That email is already registered. Try signing in instead.');
                return;
            }

            users.push({ name, email, phone, password });
            saveUsers(users);
            rememberSession(email);
            showSuccess(name);
        });

        // --- Sign In ---
        document.getElementById('signinForm').addEventListener('submit', (e) => {
            e.preventDefault();
            hideError();

            const email = document.getElementById('signinEmail').value.trim().toLowerCase();
            const password = document.getElementById('signinPassword').value;

            const users = getUsers();
            const user = users.find(u => u.email === email && u.password === password);

            if (!user) {
                showError('Incorrect email or password.');
                return;
            }

            rememberSession(user.email);
            showSuccess(user.name);
        });

        // --- Remembered session: skip straight to the success view on return visits ---
        (function checkSavedSession() {
            const savedEmail = localStorage.getItem(SESSION_KEY);
            if (!savedEmail) return;
            const users = getUsers();
            const user = users.find(u => u.email === savedEmail);
            if (user) showSuccess(user.name);
        })();
    </script>
</body>
</html>
